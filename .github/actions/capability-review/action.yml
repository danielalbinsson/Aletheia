name: Aletheia authority diff
description: >
  Diff eve-agent authority against a baseline and block the PR when the
  fail-on threshold is hit, unless the ack label is present. Inspection only
  — does not run or deploy the agent. Posts a sticky comment when the token
  can write pull-request comments.

inputs:
  baseline:
    description: Baseline for `aletheia diff` (for example git:origin/main or git:origin/<base-ref>)
    required: true
  fail-on:
    description: Fail-on threshold passed to `aletheia diff`
    required: false
    default: elevated
  agent-dir:
    description: Path to the eve agent workspace (directory containing agent/)
    required: false
    default: "."
  ack-label:
    description: PR label that acknowledges an intentional authority expansion
    required: false
    default: capability-change-ack
  cli:
    description: >
      Command used to invoke the Aletheia CLI. Default is the CLI bundled with
      this Action revision. Override to dogfood a local bin
      (for example `node ${{ github.workspace }}/bin/aletheia.mjs`).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Capability diff
      id: diff
      shell: bash
      working-directory: ${{ inputs['agent-dir'] }}
      env:
        ALETHEIA_CLI: ${{ inputs.cli }}
        ALETHEIA_BASELINE: ${{ inputs.baseline }}
        ALETHEIA_FAIL_ON: ${{ inputs['fail-on'] }}
        ALETHEIA_AGENT_DIR: ${{ inputs['agent-dir'] }}
        ALETHEIA_ACK_LABEL: ${{ inputs['ack-label'] }}
      run: |
        set -uo pipefail
        # defineAgent reads this at build time; never reuse a real secret here.
        export OPENROUTER_API_KEY=ci-placeholder-not-a-real-key
        agent_dir="$ALETHEIA_AGENT_DIR"
        if [[ "$agent_dir" != /* ]]; then
          agent_dir="${GITHUB_WORKSPACE}/${agent_dir}"
        fi
        if [ -z "${ALETHEIA_CLI}" ]; then
          ALETHEIA_CLI="node ${GITHUB_ACTION_PATH}/aletheia.mjs"
        fi
        # Workflow authors pass a command + args (node path/to/bin).
        # shellcheck disable=SC2206
        cli_cmd=($ALETHEIA_CLI)
        bash "${GITHUB_ACTION_PATH}/capability-diff.sh" \
          "${cli_cmd[@]}" diff \
          --baseline "$ALETHEIA_BASELINE" \
          --format markdown \
          --fail-on "$ALETHEIA_FAIL_ON" \
          --ack-label "$ALETHEIA_ACK_LABEL" \
          --out "${RUNNER_TEMP}/aletheia-capability-diff.md" \
          --agent-dir "$agent_dir"

    - name: Post sticky comment
      if: github.event_name == 'pull_request' && steps.diff.conclusion == 'success'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        DIFF_FILE: ${{ runner.temp }}/aletheia-capability-diff.md
        AGENT_DIR: ${{ inputs['agent-dir'] }}
      with:
        script: |
          const fs = require('fs');
          const agentKey = (process.env.AGENT_DIR || '.').replace(/[^A-Za-z0-9._/-]+/g, '-');
          const marker = `<!-- aletheia-capability-diff:${agentKey} -->`;
          let body = fs.readFileSync(process.env.DIFF_FILE, 'utf8');
          body = body.replace('<!-- aletheia-capability-diff -->', marker);
          if (!body.includes(marker)) body = `${marker}\n${body}`;
          const limit = 65000;
          if (body.length > limit) {
            body = `${body.slice(0, limit)}\n\n<sub>Truncated authority-diff report.</sub>\n`;
          }
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Gate
      if: always() && steps.diff.conclusion != 'skipped'
      shell: bash
      env:
        DIFF_EXIT: ${{ steps.diff.outputs.exit }}
        ACK: ${{ contains(github.event.pull_request.labels.*.name, inputs['ack-label']) }}
        ACK_LABEL: ${{ inputs['ack-label'] }}
        NAME: ${{ inputs['agent-dir'] }}
      run: bash "${GITHUB_ACTION_PATH}/capability-gate.sh"
