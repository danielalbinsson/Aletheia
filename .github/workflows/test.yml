name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # packages/aletheia-cli is not a pnpm workspace member; install its
      # lockfile separately so `esbuild` is available. cliSmoke.test.ts rebuilds
      # into temp storage and compares against the tracked bundle — do not
      # rewrite the tracked artifact here, or that comparison is vacuous.
      - name: Install CLI package
        run: pnpm --dir packages/aletheia-cli install --frozen-lockfile

      - name: Test
        run: pnpm test
