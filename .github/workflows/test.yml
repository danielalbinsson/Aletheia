name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # packages/aletheia-cli is not a pnpm workspace member; install its
      # lockfile separately so `esbuild` is available for the CLI bundle.
      # cliSmoke.test.ts also rebuilds this package in beforeAll.
      - name: Install CLI package
        run: pnpm --dir packages/aletheia-cli install --frozen-lockfile

      - name: Build CLI
        run: pnpm --dir packages/aletheia-cli build

      - name: Test
        run: pnpm test
