name: Authority diff

# Posts a plain-language authority diff on PRs that touch the bundled
# design-qa agent, and blocks merge when the fail-on threshold is hit unless
# acknowledged with the "capability-change-ack" label.
#
# Consumers should use the composite action rather than copying this workflow:
#   uses: danielalbinsson/Aletheia/.github/actions/capability-review@<commit-sha>
# This repo builds the local CLI bin (PRs change the CLI) and passes it via `cli`.
# The Action default is the CLI bundled at that Action revision.
#
# The support-bot blueprint lives in its own repo (danielalbinsson/eve-blueprints)
# and runs its own copy of this workflow there.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  capability-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: design-qa
            agent_dir: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (repo)
        run: pnpm install --frozen-lockfile

      # packages/aletheia-cli is not a pnpm workspace member; root
      # `pnpm build:cli` needs esbuild on PATH, which only this install provides.
      - name: Install CLI package
        run: pnpm --dir packages/aletheia-cli install --frozen-lockfile

      - name: Build the diff CLI
        run: |
          pnpm --dir packages/aletheia-cli build
          mkdir -p bin
          cp packages/aletheia-cli/bin/aletheia.mjs bin/aletheia.mjs
          chmod +x bin/aletheia.mjs

      - name: Authority diff
        uses: ./.github/actions/capability-review
        with:
          baseline: git:origin/${{ github.base_ref }}
          fail-on: elevated
          agent-dir: ${{ matrix.agent_dir }}
          cli: node ${{ github.workspace }}/bin/aletheia.mjs
